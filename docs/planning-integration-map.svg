<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" role="img" aria-label="Production Planning receives sales orders from Sales and CRM, item and calendar master data from Masters, and BOMs, routings and work centres from Product Engineering. Its internal chain runs Sales Forecast to Demand to Master Schedule to MRP to Production Orders to Capacity and Schedule. MRP consumes on-hand stock from Inventory and open purchase orders from Procurement as scheduled receipts, and emits purchase requisitions back to Procurement. Production Orders reserve material in Inventory and release orders to Shop Floor Execution, which reports finished goods receipts and material consumption back to Inventory.">
      <rect width="1240" height="700" fill="#FFFFFF"/>
  <g fill="#141922" color="#3A4459">
  <text x="30" y="40" font-family="Archivo, sans-serif" font-size="19" font-weight="700" fill="#141922">SSB Manufacturing ERP — Production Planning integration map</text>
  <text x="30" y="60" font-family="IBM Plex Sans, sans-serif" font-size="12.5" fill="#646F8A">Dashed = Planning consumes (read-only, owned by another portal)  ·  Blue = Planning produces (a document another portal then owns)</text>
  <defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
        </marker>
        <marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#2F5BFF"/>
        </marker>
      </defs>

      <!-- ===== Planning container ===== -->
      <rect x="360" y="70" width="470" height="560" rx="8" fill="none" stroke="currentColor" stroke-width="2"/>
      <text x="595" y="98" text-anchor="middle" font-size="13" font-weight="600" font-family="Archivo, sans-serif" fill="currentColor" letter-spacing="1.4">PRODUCTION PLANNING</text>

      <!-- internal chain -->
      <g font-family="IBM Plex Sans, sans-serif" font-size="13">
        <rect x="395" y="120" width="400" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <text x="595" y="148" text-anchor="middle" fill="currentColor">Sales Forecast</text>

        <rect x="395" y="196" width="400" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <text x="595" y="224" text-anchor="middle" fill="currentColor">Demand</text>

        <rect x="395" y="272" width="400" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <text x="595" y="300" text-anchor="middle" fill="currentColor">Master Schedule (MPS)</text>

        <rect x="395" y="348" width="400" height="46" rx="5" fill="#2F5BFF" fill-opacity="0.1" stroke="#2F5BFF" stroke-width="2"/>
        <text x="595" y="376" text-anchor="middle" fill="currentColor" font-weight="600">MRP — the engine</text>

        <rect x="395" y="424" width="400" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <text x="595" y="452" text-anchor="middle" fill="currentColor">Production Orders</text>

        <rect x="395" y="500" width="400" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <text x="595" y="528" text-anchor="middle" fill="currentColor">Capacity &amp; Schedule Board</text>
      </g>

      <!-- chain arrows -->
      <g stroke="currentColor" stroke-width="1.6" marker-end="url(#ar)">
        <line x1="595" y1="166" x2="595" y2="192"/>
        <line x1="595" y1="242" x2="595" y2="268"/>
        <line x1="595" y1="318" x2="595" y2="344"/>
        <line x1="595" y1="394" x2="595" y2="420"/>
        <line x1="595" y1="470" x2="595" y2="496"/>
      </g>

      <!-- ===== Left: sources ===== -->
      <g font-family="IBM Plex Sans, sans-serif" font-size="13">
        <rect x="30" y="120" width="215" height="72" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <text x="137" y="150" text-anchor="middle" font-weight="600" fill="currentColor">Sales &amp; CRM</text>
        <text x="137" y="171" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".72">Sales orders</text>

        <rect x="30" y="250" width="215" height="90" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <text x="137" y="278" text-anchor="middle" font-weight="600" fill="currentColor">Masters</text>
        <text x="137" y="298" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".72">Item · UOM · Plant</text>
        <text x="137" y="316" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".72">Shift · Holiday calendar</text>

        <rect x="30" y="400" width="215" height="90" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <text x="137" y="428" text-anchor="middle" font-weight="600" fill="currentColor">Product Engineering</text>
        <text x="137" y="448" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".72">BOM · Routing</text>
        <text x="137" y="466" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".72">Work centres · Products</text>
      </g>

      <!-- left inbound arrows (dashed = Planning consumes) -->
      <g stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)">
        <path d="M 245 156 C 300 156, 320 205, 391 214"/>
        <path d="M 245 295 C 300 295, 320 293, 391 293"/>
        <path d="M 245 432 C 300 432, 330 380, 391 369"/>
        <path d="M 245 462 C 300 462, 330 515, 391 521"/>
      </g>
      <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="currentColor" opacity=".8">
        <text x="318" y="176" text-anchor="middle">sales orders</text>
        <text x="318" y="284" text-anchor="middle">item · calendar</text>
        <text x="322" y="392" text-anchor="middle">BOM explosion</text>
        <text x="324" y="502" text-anchor="middle">routing · WC</text>
      </g>

      <!-- ===== Right: consumers ===== -->
      <g font-family="IBM Plex Sans, sans-serif" font-size="13">
        <rect x="945" y="120" width="215" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <text x="1052" y="150" text-anchor="middle" font-weight="600" fill="currentColor">Procurement</text>
        <text x="1052" y="171" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".72">PR → PO → GRN</text>

        <rect x="945" y="300" width="215" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <text x="1052" y="330" text-anchor="middle" font-weight="600" fill="currentColor">Inventory</text>
        <text x="1052" y="351" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".72">Stock · reservations</text>

        <rect x="945" y="480" width="215" height="80" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <text x="1052" y="510" text-anchor="middle" font-weight="600" fill="currentColor">Shop Floor Execution</text>
        <text x="1052" y="531" text-anchor="middle" font-size="11.5" fill="currentColor" opacity=".72">Operations · output</text>
      </g>

      <!-- inbound from right (dashed) -->
      <g stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)">
        <path d="M 945 186 C 880 200, 870 340, 799 358"/>
        <path d="M 945 330 C 890 330, 880 366, 799 371"/>
      </g>
      <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="currentColor" opacity=".8">
        <text x="874" y="248" text-anchor="middle">open PO =</text>
        <text x="874" y="262" text-anchor="middle">sched. receipt</text>
        <text x="872" y="322" text-anchor="middle">on-hand</text>
      </g>

      <!-- outbound to right (solid accent = Planning produces) -->
      <g stroke="#2F5BFF" stroke-width="2" fill="none" marker-end="url(#ar-acc)">
        <path d="M 799 384 C 870 384, 880 220, 941 176"/>
        <path d="M 799 440 C 870 440, 880 380, 941 356"/>
        <path d="M 799 458 C 870 458, 890 500, 941 510"/>
      </g>
      <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="#2F5BFF" font-weight="500">
        <text x="900" y="404" text-anchor="middle">purchase</text>
        <text x="900" y="418" text-anchor="middle">requisitions</text>
        <text x="878" y="440" text-anchor="middle">reserve</text>
        <text x="884" y="486" text-anchor="middle">release order</text>
      </g>

      <!-- shop floor back to inventory -->
      <g stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#ar)">
        <path d="M 1052 480 L 1052 384"/>
      </g>
      <text x="1062" y="436" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="currentColor" opacity=".8">output ·</text>
      <text x="1062" y="450" font-family="IBM Plex Mono, monospace" font-size="10.5" fill="currentColor" opacity=".8">consumption</text>

      <!-- feedback: production orders back to demand (make-to-stock loop) -->
      <g stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 3" fill="none" marker-end="url(#ar)">
        <path d="M 391 447 C 340 447, 340 230, 391 219"/>
      </g>
      <text x="352" y="340" font-family="IBM Plex Mono, monospace" font-size="10" fill="currentColor" opacity=".65" transform="rotate(-90 352 340)" text-anchor="middle">firm orders net demand</text>
      </g>
</svg>