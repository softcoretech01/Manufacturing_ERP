[project]
name = "ssberp-backend"
version = "0.1.0"
description = "Stainless Steel Water Bottle Manufacturing ERP - Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.1",
    "cryptography>=43.0.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "python-ulid>=3.0.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=8.0",
    "jinja2>=3.1.4",
    "openpyxl>=3.1.5",
    "xlsxwriter>=3.2.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "python-barcode>=0.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
    "faker>=30.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "N818"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
