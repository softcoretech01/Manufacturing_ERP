services:
  redis:
    image: redis:7-alpine
    container_name: ssb-industry-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ssb-industry-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ssb-industry-mailhog
    restart: unless-stopped
    ports:
      - "1026:1025"
      - "8026:8025"

  backend:
    build: ./backend
    container_name: ssb-industry-backend
    restart: unless-stopped
    ports:
      - "8010:8000"
    depends_on:
      - redis
      - minio
    env_file:
      - ./backend/.env

  web:
    build: ./web
    container_name: ssb-industry-web
    restart: unless-stopped
    ports:
      - "5177:5176"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=/api/v1
      - BACKEND_URL=http://backend:8000

volumes:
  redis_data:
  minio_data:
